[package]
name = "depverify-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "DependencyVerifier agent: inventories what runs in production and reports it to a DependencyVerifier console over an outbound-only, signed connection."
license = "Apache-2.0"
repository = "https://github.com/DependencyVerifier/agent"
publish = false

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.3"
globset = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
